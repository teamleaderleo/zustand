name: Fieldwork format rehydrate native test

on:
  push:
    branches:
      - fieldwork/persist-rehydrate-error-settlement
    paths:
      - '.github/workflows/fieldwork-format-rehydrate-native-test.yml'

permissions:
  contents: write

concurrency:
  group: fieldwork-format-rehydrate-native-test
  cancel-in-progress: false

jobs:
  format-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/persist-rehydrate-error-settlement
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Verify reviewed input generation
        run: |
          test "$(git hash-object src/middleware/persist.ts)" = f90dd2f0faeff2155c5fac083b453525b500f97d
          test "$(git hash-object tests/persistRehydrateError.test.ts)" = d8eb259c458d0a85ac6b2657e95473b95fcca2e8
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format native test
        run: pnpm prettier tests/persistRehydrateError.test.ts --write
      - name: Run ordinary repository gate
        run: |
          pnpm run test:format
          pnpm run test:types
          pnpm run test:lint
          pnpm run test:spec
          pnpm run build
          git diff --check
      - name: Publish formatted source-only branch
        run: |
          rm .github/workflows/fieldwork-format-rehydrate-native-test.yml
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add tests/persistRehydrateError.test.ts .github/workflows/fieldwork-format-rehydrate-native-test.yml
          git diff --cached --quiet && exit 1
          git commit -m 'Format persist rehydrate error regression'
          git push origin HEAD:fieldwork/persist-rehydrate-error-settlement
