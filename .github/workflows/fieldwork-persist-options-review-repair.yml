name: Fieldwork persist option review repair

on:
  push:
    branches:
      - fieldwork/persist-undefined-option-overrides
    paths:
      - '.github/workflows/fieldwork-persist-options-review-repair.yml'

permissions:
  contents: write

concurrency:
  group: fieldwork-persist-options-review-repair
  cancel-in-progress: false

jobs:
  repair-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/persist-undefined-option-overrides
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Verify reviewed source generation
        run: |
          test "$(git hash-object src/middleware/persist.ts)" = e1afebc2212289b47db4ccf35900c2669d4f9737
          test "$(git hash-object tests/persistUndefinedOptions.test.ts)" = c0b5bf291fc99cb13c07b23681d55f5653c3d4cc
      - name: Apply key-order and custom-value controls
        shell: python
        run: |
          from pathlib import Path

          source = Path('src/middleware/persist.ts')
          text = source.read_text(encoding='utf-8')
          old = '''  let options = {
              ...restOptions,
              storage: initialStorage,
              partialize,
              version,
              merge,
            }
          '''
          new = '''  let options = {
              storage: initialStorage,
              partialize,
              version,
              merge,
              ...restOptions,
            }
          '''
          if text.count(old) != 1:
              raise SystemExit('persist construction anchor mismatch')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/persistUndefinedOptions.test.ts')
          text = tests.read_text(encoding='utf-8')
          if "preserves the historical construction option key order" in text:
              raise SystemExit('compatibility regressions already present')
          marker = '\n})\n'
          if not text.endswith(marker):
              raise SystemExit('test suite closing anchor mismatch')
          addition = r'''

            it('preserves the historical construction option key order', () => {
              const storage = createJSONStorage(() => ({
                getItem: () => null,
                setItem: () => {},
                removeItem: () => {},
              }))
              const store = createStore(
                persist(() => ({ count: 0 }), {
                  name: 'test-storage',
                  skipHydration: true,
                  storage,
                }),
              )

              expect(Object.keys(store.persist.getOptions())).toEqual([
                'storage',
                'partialize',
                'version',
                'merge',
                'name',
                'skipHydration',
              ])
            })

            it('preserves custom current values across undefined updates', () => {
              const storage = createJSONStorage(() => ({
                getItem: () => null,
                setItem: () => {},
                removeItem: () => {},
              }))
              const partialize = (state: CountState) => state
              const merge = (persistedState: unknown, currentState: CountState) => ({
                ...currentState,
                ...(persistedState as object),
              })
              const store = createStore(
                persist(() => ({ count: 0 }), {
                  name: 'custom-storage',
                  skipHydration: true,
                  storage,
                  partialize,
                  version: 7,
                  merge,
                }),
              )

              store.persist.setOptions(
                runtimeUpdate({
                  name: undefined,
                  storage: undefined,
                  partialize: undefined,
                  version: undefined,
                  merge: undefined,
                }),
              )

              expect(store.persist.getOptions()).toMatchObject({
                name: 'custom-storage',
                storage,
                partialize,
                version: 7,
                merge,
              })
            })
          '''
          tests.write_text(text[:-len(marker)] + addition + marker, encoding='utf-8')
      - name: Install and validate
        run: |
          pnpm install
          pnpm vitest run \
            tests/persistUndefinedOptions.test.ts \
            tests/persistAsync.test.tsx \
            tests/persistSync.test.tsx
          pnpm eslint \
            src/middleware/persist.ts \
            tests/persistUndefinedOptions.test.ts
          pnpm prettier --check \
            src/middleware/persist.ts \
            tests/persistUndefinedOptions.test.ts
          git diff --check
      - name: Publish source-only repair
        run: |
          rm .github/workflows/fieldwork-persist-options-review-repair.yml
          git config user.name fieldwork-ci
          git config user.email fieldwork-ci@users.noreply.github.com
          git add src/middleware/persist.ts tests/persistUndefinedOptions.test.ts .github/workflows
          git commit -m 'Preserve persist option order and custom values'
          git push origin HEAD:fieldwork/persist-undefined-option-overrides
