name: Fieldwork persist rehydrate observer settlement

on:
  pull_request:
    paths:
      - 'src/middleware/persist.ts'
      - 'tests/persistRehydrateError.test.ts'
      - 'tests/persistRehydrateObserverSettlement.test.ts'
      - '.github/workflows/fieldwork-persist-rehydrate-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install
      - run: |
          pnpm vitest run \
            tests/persistRehydrateObserverSettlement.test.ts \
            tests/persistRehydrateError.test.ts \
            tests/persistAsync.test.tsx \
            tests/persistSync.test.tsx
      - run: |
          pnpm eslint \
            src/middleware/persist.ts \
            tests/persistRehydrateError.test.ts \
            tests/persistRehydrateObserverSettlement.test.ts
      - run: |
          pnpm prettier \
            tests/persistRehydrateObserverSettlement.test.ts \
            --check
