name: Fieldwork finalize rehydrate observer tests

on:
  push:
    branches:
      - fieldwork/persist-rehydrate-observer-characterization
    paths:
      - '.github/workflows/fieldwork-finalize-rehydrate-observer-tests.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldwork-finalize-rehydrate-observer-tests
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/persist-rehydrate-observer-characterization
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Apply repository test formatting
        run: |
          pnpm eslint tests/persistRehydrateObserverSettlement.test.ts --fix
          pnpm prettier \
            tests/persistRehydrateError.test.ts \
            tests/persistRehydrateObserverSettlement.test.ts \
            --write
          git diff --check
      - name: Remove one-time finalizer
        run: rm .github/workflows/fieldwork-finalize-rehydrate-observer-tests.yml
      - name: Commit exact formatted tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/persistRehydrateError.test.ts \
            tests/persistRehydrateObserverSettlement.test.ts \
            .github/workflows/fieldwork-finalize-rehydrate-observer-tests.yml
          git commit -m 'test(persist): finalize observer settlement controls'
          git push origin HEAD:fieldwork/persist-rehydrate-observer-characterization
