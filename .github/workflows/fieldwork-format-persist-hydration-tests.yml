name: Fieldwork format persist hydration tests

on:
  pull_request:
    branches:
      - base/upstream-20260801

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Apply exact formatting to candidate branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin \
            refs/heads/fix/persist-clear-storage-hydration-generation:refs/remotes/origin/fix/persist-clear-storage-hydration-generation \
            refs/heads/fix/persist-storage-replacement-hydration-generation:refs/remotes/origin/fix/persist-storage-replacement-hydration-generation

          format_branch() {
            branch="$1"
            file="$2"
            message="$3"
            git checkout -B "$branch" "origin/$branch"
            pnpm exec prettier --write "$file"
            if git diff --quiet -- "$file"; then
              echo "$branch already formatted"
              return
            fi
            git add "$file"
            git commit -m "$message"
            git push origin "HEAD:$branch"
          }

          format_branch \
            fix/persist-clear-storage-hydration-generation \
            tests/persistClearStorageHydrationGeneration.test.ts \
            'test: format clear-storage hydration regression'
          format_branch \
            fix/persist-storage-replacement-hydration-generation \
            tests/persistStorageReplacementHydrationGeneration.test.ts \
            'test: format storage-replacement hydration regression'
