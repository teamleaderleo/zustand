name: Fieldwork persist hydration candidate gate

on:
  pull_request:
    branches:
      - base/upstream-20260801

permissions:
  contents: read

concurrency:
  group: fieldwork-persist-hydration-candidate-gate
  cancel-in-progress: true

jobs:
  candidate:
    if: >-
      github.repository == 'teamleaderleo/zustand' &&
      github.head_ref == 'execution/format-persist-hydration-tests'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clear-storage
            head: 001900bb01102417c016afa3341e384f53474492
            test_file: tests/persistClearStorageHydrationGeneration.test.ts
          - name: storage-replacement
            head: 665e0399ee5dc3e877f4cbd431a326eac56f42db
            test_file: tests/persistStorageReplacementHydrationGeneration.test.ts
    name: candidate (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: lts/*
          cache: pnpm
      - name: Verify exact source and two-file fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.head }}"
          test "$(git diff --name-only beca84e600e4e250f6b244d22878e72948f331c7..HEAD | sort)" = $'src/middleware/persist.ts\n${{ matrix.test_file }}'
          git diff --check beca84e600e4e250f6b244d22878e72948f331c7..HEAD
          test -z "$(git status --porcelain)"
      - name: Install dependencies
        run: pnpm install
      - name: Run repository format gate
        run: pnpm run test:format
      - name: Run repository type gate
        run: pnpm run test:types
      - name: Run repository lint gate
        run: pnpm run test:lint
      - name: Run repository spec gate
        run: pnpm run test:spec
      - name: Verify candidate identity and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.head }}"
          git diff --check
          test -z "$(git status --porcelain)"
          echo "FIELDWORK_ZUSTAND_CANDIDATE=${{ matrix.name }}@$(git rev-parse HEAD)"
