name: Fieldwork format persist hydration tests

on:
  pull_request:
    branches:
      - base/upstream-20260801

permissions:
  contents: write

concurrency:
  group: fieldwork-format-persist-hydration-tests
  cancel-in-progress: true

env:
  CLEAR_BRANCH: fix/persist-clear-storage-hydration-generation
  CLEAR_HEAD: 4f9d0aa5e8adaa77a7074b746f0055d0ede05760
  REPLACEMENT_BRANCH: fix/persist-storage-replacement-hydration-generation
  REPLACEMENT_HEAD: 0412d59cfe16c6f558cba122313e962e28ecac34

jobs:
  format:
    if: >-
      github.repository == 'teamleaderleo/zustand' &&
      github.head_ref == 'execution/format-persist-hydration-tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Format and publish exact candidate tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name fieldwork-repair-bot
          git config user.email fieldwork-repair-bot@users.noreply.github.com
          git fetch origin \
            "refs/heads/$CLEAR_BRANCH:refs/remotes/origin/$CLEAR_BRANCH" \
            "refs/heads/$REPLACEMENT_BRANCH:refs/remotes/origin/$REPLACEMENT_BRANCH"

          test "$(git rev-parse "origin/$CLEAR_BRANCH")" = "$CLEAR_HEAD"
          test "$(git rev-parse "origin/$REPLACEMENT_BRANCH")" = "$REPLACEMENT_HEAD"

          format_branch() {
            branch="$1"
            expected_head="$2"
            file="$3"
            message="$4"

            git checkout -B "$branch" "$expected_head"
            test "$(git rev-parse HEAD)" = "$expected_head"
            test -z "$(git status --porcelain)"

            pnpm exec prettier --write "$file"
            pnpm exec prettier --check "$file"
            git diff --check

            if git diff --quiet -- "$file"; then
              echo "$branch already formatted"
              return
            fi

            test "$(git diff --name-only)" = "$file"
            git add "$file"
            test "$(git diff --cached --name-only)" = "$file"
            git commit -m "$message"

            git fetch origin "$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$expected_head"
            git push origin "HEAD:$branch"
          }

          format_branch \
            "$CLEAR_BRANCH" \
            "$CLEAR_HEAD" \
            tests/persistClearStorageHydrationGeneration.test.ts \
            'test: format clear-storage hydration regression'

          format_branch \
            "$REPLACEMENT_BRANCH" \
            "$REPLACEMENT_HEAD" \
            tests/persistStorageReplacementHydrationGeneration.test.ts \
            'test: format storage-replacement hydration regression'
