name: Fieldwork persist rehydrate error settlement

on:
  pull_request:
    paths:
      - '.fieldwork/persist-rehydrate-error-settlement.patch'
      - '.fieldwork/persistRehydrateError.vitest.ts'
      - '.github/workflows/fieldwork-persist-rehydrate-error.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: corepack enable

      - name: Apply candidate source patch
        run: git apply --check .fieldwork/persist-rehydrate-error-settlement.patch && git apply .fieldwork/persist-rehydrate-error-settlement.patch

      - name: Stage candidate-only regression
        run: cp .fieldwork/persistRehydrateError.vitest.ts tests/persistRehydrateError.test.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run persist regression suites
        run: pnpm vitest run tests/persistRehydrateError.test.ts tests/persistAsync.test.tsx tests/persistSync.test.tsx

      - name: Lint candidate regression
        run: pnpm eslint .fieldwork/persistRehydrateError.vitest.ts
