name: Fieldwork persist undefined options

on:
  pull_request:
    paths:
      - '.fieldwork/persistUndefinedOptions.vitest.ts'
      - '.github/workflows/fieldwork-persist-undefined-options.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: corepack enable

      - name: Stage characterization test
        run: cp .fieldwork/persistUndefinedOptions.vitest.ts tests/persistUndefinedOptions.test.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run characterization and existing persist suites
        run: pnpm vitest run tests/persistUndefinedOptions.test.ts tests/persistAsync.test.tsx tests/persistSync.test.tsx

      - name: Lint characterization
        run: pnpm eslint .fieldwork/persistUndefinedOptions.vitest.ts
